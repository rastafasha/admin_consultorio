<app-loading *ngIf="isLoading"></app-loading>
<div class="tasastyle " *ngIf="moneda ==='USD' && !isLoading">
        <p>$Bcv: </p>
        <a routerLink="/tasabcv/edit">{{tasadollar|currency:'Bs.'}}</a>
</div>
<div class="tasastyle " *ngIf="moneda ==='EUR' && !isLoading">
        <p>€Bcv: </p>
        <a routerLink="/tasabcv/edit">{{tasaeuro|currency:'Bs.'}}</a>
</div>
<div class="tasastyle " *ngIf="moneda ==='PERSONALIZADA' && !isLoading">
        <p>$P: </p>
        <a routerLink="/tasabcv/edit">{{tasa|currency:'Bs.'}}</a>
</div>
